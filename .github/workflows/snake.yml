name: neon-snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#FF2A6D&color_dots=#ebedf0,#b3f0f7,#5ee4ef,#05D9E8,#028a94
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF2A6D&color_dots=#161b22,#1a0b3d,#3d1a78,#8a2be2,#05D9E8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
